<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>yanejonny stream intro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }

  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 1600px;
  }

  /* обёртка только для плавного появления/исчезновения (без 3D) */
  .wrap {
    position: relative;
    width: min(80vw, 80vh * 1.5);
    aspect-ratio: 1.5 / 1;
    opacity: 0;
  }

  /* 3D-контейнер: здесь крутится, прозрачности не трогаем */
  .spinner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
  }

  .face {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden;
  }
  .face img {
    max-width: 100%; max-height: 100%;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.55));
  }

  /* первый логотип чуть меньше, чтобы визуально совпадал по размеру с ником */
  #first img { max-height: 92%; }
  #second { transform: rotateY(180deg); opacity: 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="wrap" id="wrap">
    <div class="spinner" id="spinner">
      <div class="face" id="first"><img id="img1" src="wow.png" alt=""></div>
      <div class="face" id="second"><img id="img2" src="logo.png" alt=""></div>
    </div>
  </div>
</div>

<script>
/* Настройки через ссылку:
   ?every=30   период повтора в секундах — от начала одного показа до начала следующего (по умолчанию 30)
   ?loop=0     показать один раз и не повторять
   ?hold=2500  сколько мс держать первый логотип (по умолчанию 2200)
   ?show=4000  сколько мс держать итоговый логотип с ником (по умолчанию 5000)
   ?keep=1     не исчезать в конце, остаться на экране (повтор отключается) */
const q = new URLSearchParams(location.search);
const LOOP  = q.get('loop') !== '0';          // повтор включён по умолчанию
const KEEP  = q.get('keep') === '1';
const EVERY = +(q.get('every') || 30) * 1000; // период, мс
const HOLD  = +(q.get('hold') || 2200);
const SHOW  = +(q.get('show') || 5000);
const SPIN  = 2400;

const wrap = document.getElementById('wrap');
const spinner = document.getElementById('spinner');
const first = document.getElementById('first');
const second = document.getElementById('second');

const sleep = ms => new Promise(r => setTimeout(r, ms));
function loaded(img) {
  return img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; });
}

async function play() {
  const started = performance.now();
  const opt = (d, extra = {}) => ({ duration: d, fill: 'forwards', easing: 'ease-in-out', ...extra });

  [wrap, spinner, first, second].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  first.style.opacity = 1; second.style.opacity = 0;

  // появление первого логотипа (wow)
  await wrap.animate(
    [{ opacity: 0 }, { opacity: 1 }],
    opt(700, { easing: 'ease-out' })
  ).finished;

  await sleep(HOLD);

  // вращение: 540°, на 270° (ребро) подменяем wow на логотип с ником
  first.animate([{ opacity: 1 }, { opacity: 1, offset: .5 }, { opacity: 0, offset: .5001 }, { opacity: 0 }], opt(SPIN, { easing: 'linear' }));
  second.animate([{ opacity: 0 }, { opacity: 0, offset: .5 }, { opacity: 1, offset: .5001 }, { opacity: 1 }], opt(SPIN, { easing: 'linear' }));
  await spinner.animate(
    [{ transform: 'scale(1) rotateY(0deg)' },
     { transform: 'scale(1.12) rotateY(270deg)', offset: .5 },
     { transform: 'scale(1) rotateY(540deg)' }],
    opt(SPIN)
  ).finished;

  if (KEEP) return;

  await sleep(SHOW);

  // исчезновение
  await wrap.animate(
    [{ opacity: 1 }, { opacity: 0 }],
    opt(600)
  ).finished;

  // ждём, пока с начала показа не пройдёт EVERY (по умолчанию 30 с), и запускаем снова
  if (LOOP) {
    const elapsed = performance.now() - started;
    await sleep(Math.max(1000, EVERY - elapsed));
    play();
  }
}

Promise.all([loaded(document.getElementById('img1')), loaded(document.getElementById('img2'))]).then(play);
</script>
</body>
</html>
